name: Build image
permissions: read-all

# On a push to main, a package.json version with no `vX.Y.Z` tag yet is
# released: the image is also tagged with the version and the git tag is created
# on this commit. The tag is pushed here because a tag pushed with GITHUB_TOKEN
# starts no other workflow.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]
  # Fired by github.com/Macrostrat/docs when the documentation vault changes,
  # so the /docs section is rebuilt without a commit here.
  repository_dispatch:
    types: [docs-updated]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialized, so a second merge sees the tag the first one created
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
      # The /docs section of the site is assembled from the documentation vault
      # (github.com/Macrostrat/docs) into ./content before the image is built.
      # The vault is checked out under .cache/ (docker-ignored); only the
      # assembled content/ tree reaches the image.
      - name: Checkout documentation vault
        uses: actions/checkout@v3
        with:
          repository: Macrostrat/docs
          ref: main
          path: .cache/docs
      - name: Assemble documentation
        env:
          DOCS_SOURCE_DIR: .cache/docs
        run: |
          corepack enable
          bash scripts/assemble-docs.sh
      - name: Read release state
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          NEW=true
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            NEW=false
          fi
          if [[ "$NEW" == true && "$VERSION" != *-* ]] && ! grep -Eq "^## \[?${VERSION//./\\.}\]?( |$)" docs/changelog.md; then
            echo "::error::Releasing ${VERSION} needs a '## ${VERSION}' heading in docs/changelog.md"
            exit 1
          fi
          RELEASE=false
          if [[ "$NEW" == true && "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            RELEASE=true
          fi
          STABLE=false
          if [[ "$VERSION" != *-* ]]; then
            STABLE=true
          fi
          echo "${TAG}: new=${NEW} release=${RELEASE}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "release=${RELEASE}"
            echo "stable=${STABLE}"
          } >> $GITHUB_OUTPUT
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hub.opensciencegrid.org/macrostrat/web
          tags: |
            type=raw,value=sha-{{sha}}
            type=ref,event=pr,suffix=-{{date 'YYYYMMDDHHmmss'}}
            type=ref,event=branch,suffix=-{{date 'YYYYMMDDHHmmss'}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.release == 'true' && steps.version.outputs.stable == 'true' }}
          flavor: |
            latest=false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to OSG DockerHub
        uses: docker/login-action@v2
        with:
          registry: hub.opensciencegrid.org
          username: ${{ vars.HARBOR_CLI_NAME }}
          password: ${{ secrets.HARBOR_CLI_SECRET }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MACROSTRAT_VERSION=${{ steps.version.outputs.version }}
            MACROSTRAT_RELEASE=${{ steps.version.outputs.release }}
            MACROSTRAT_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            MACROSTRAT_BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            MACROSTRAT_REPOSITORY=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Version ${TAG#v}"
          git push origin "$TAG"
