name: Build map snapshot renderer image
permissions: read-all
on:
  push:
    branches: ["main"]
    paths:
      - "packages/map-snapshot-renderer/**"
      - "packages/map-snapshots/**"
      - "yarn.lock"
      - ".github/workflows/build-map-snapshot-renderer.yaml"
  pull_request:
    branches: [main]
    paths:
      - "packages/map-snapshot-renderer/**"
      - "packages/map-snapshots/**"
      - "yarn.lock"
      - ".github/workflows/build-map-snapshot-renderer.yaml"

# The renderer ships on its own image: headless Chromium stays out of the web
# image. See packages/map-snapshot-renderer/README.md.
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: hub.opensciencegrid.org/macrostrat/map-snapshot-renderer
          # `main-<date>` is what the cluster's image policies follow.
          tags: |
            type=raw,value=sha-{{sha}}
            type=ref,event=pr,suffix=-{{date 'YYYYMMDDHHmmss'}}
            type=ref,event=branch,suffix=-{{date 'YYYYMMDDHHmmss'}}
          flavor: |
            latest=false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to OSG DockerHub
        uses: docker/login-action@v2
        with:
          registry: hub.opensciencegrid.org
          username: ${{ vars.HARBOR_CLI_NAME }}
          password: ${{ secrets.HARBOR_CLI_SECRET }}
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: packages/map-snapshot-renderer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=map-snapshot-renderer
          cache-to: type=gha,mode=max,scope=map-snapshot-renderer
